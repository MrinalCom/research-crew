services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph_crew
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/langgraph_crew
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_workspaces:/srv/workspaces

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_API_DEV_KEY: ${API_DEV_KEY:-dev-local-key}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_workspaces:
