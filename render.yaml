services:
  - type: web
    name: research-crew-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string here
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel frontend URL, e.g. https://research-crew.vercel.app
      - key: API_DEV_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: MAX_REVISIONS
        value: "3"
      - key: CODE_EXEC_TIMEOUT_SECONDS
        value: "10"
      - key: CODE_EXEC_MEMORY_LIMIT_MB
        value: "256"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_PROJECT
        value: langgraph-research-crew
      - key: LOG_LEVEL
        value: INFO
